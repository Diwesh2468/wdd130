<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prophet Card| Dallin H. Oaks</title>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&display=swap" rel="stylesheet">
<style>
    body{
        background: color #ffecd7;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }
    .card{
        background-color: #008DB1;
      border: 4px solid #004E63;
      border-radius: 25px;
      width: 360px;
      padding: 20px 30px;
      text-align: center;
      font-family: Helvetica, Arial, sans-serif; 
    }
    h1{
        color: #FFFFFE;
        font-size: 2.5rem;
        margin:10px 0;
    }
    .subtitle{
        color:#91E4FB;
        text-decoration: none;
        font-size: 1.1rem;
    }
    img{
        width:100%;
        border:4px solid white;
        margin-top:20px;
    }
    ul {
      color: #FFFFFE;
      font-size: 1.2rem;
      display: inline-block;
      text-align: left;
      margin: 10px 0;
      line-height: 1.5;
    }
    .quote{
        color: #ffd783;
        font-family: "Brush Script MT", "Nanum Brush Script", cursive;
        font-size: 1.6rem;
        line-height:1.4;
    }
</style>
</head>
<body>
    <div class="card">
    <h1>Dallin H. Oaks</h1>
    <a class="subtitle" href="https://www.churchofjesuschrist.org">
        18th President of the Church of Jesus Christ of Latter-day Saints
    </a>
    <img src="images/image.jpg" alt="Portrait of Dallin H. Oaks">
    <ul>
        <li>Born: Aug 12, 1932</li>
        <li>Apostle: Apr 7, 1984</li>
        <li>Prophet: Oct 14, 2025</li>
      </ul>
      <p class="quote">"The gospel of Jesus Christ teaches us that our highest priority is to love God and to love our fellowmen."</p>
    </div>
  </body>
  </html>
